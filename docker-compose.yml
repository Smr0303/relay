# Postgres for Phase 2+. Port 5440 keeps clear of other local Postgres instances.
services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements",
              "-c", "max_connections=300", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5440:5432"
    volumes:
      - relay-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 2s
      retries: 15
  # Observability stack: `make obs-up` (docker compose --profile obs up -d)
  jaeger:
    profiles: ["obs"]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI + query API
      - "4318:4318"     # OTLP over HTTP
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "9090:9090"
  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
volumes:
  relay-pg:
