[project]
name = "relay"
version = "0.1.0"
description = "Durable workflow engine on Postgres: journal + replay"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "aiohttp>=3.9",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.32",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["chaos: slow kill-everything test (make chaos)"]
addopts = "-m 'not chaos' --timeout 300"
